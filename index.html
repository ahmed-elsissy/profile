<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#092235">
  <title>Profile | صفحة الشركة</title>
  <style>
    :root { --ink: #092235; --teal: #087a70; --mint: #eaf7f4; --paper: #fffdf8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: Tahoma, Arial, sans-serif; }
    main { width: min(720px, calc(100% - 40px)); padding: 56px 36px; text-align: center; border: 1px solid #cfe5e1; border-radius: 24px; background: #fff; box-shadow: 0 20px 60px rgba(9, 34, 53, .1); }
    .eyebrow { margin: 0 0 14px; color: var(--teal); font-size: .9rem; font-weight: 700; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.35; }
    p { margin: 18px auto 0; max-width: 550px; color: #375361; font-size: 1.05rem; line-height: 1.9; }
    .status { display: inline-block; margin-top: 28px; padding: 10px 16px; border-radius: 999px; background: var(--mint); color: var(--teal); font-size: .9rem; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">PROFILE</p>
    <h1>صفحة الشركة قيد الإعداد</h1>
    <p>نجهّز حالياً تجربة تعريفية تعكس هوية الشركة وخدماتها بشكل واضح واحترافي.</p>
    <span class="status">نعمل حالياً على نسخة التطوير</span>
  </main>
</body>
</html>
